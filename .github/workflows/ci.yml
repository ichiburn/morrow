name: ci

on:
  push:
    branches: [main]
  pull_request:

# No secrets are needed by this workflow, and none are granted.
# Agent execution never happens here; see docs/architecture/operations.md.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.19"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # `--locked` rather than `--frozen`: it also fails when the lockfile has drifted
      # from pyproject.toml. Without a lockfile at all, CI would re-resolve every run and
      # a compromised upstream release inside the declared version ranges would execute
      # here with no reviewable diff.
      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest -m 'not integration'

      # C1 and C4 in the README are checkable claims, so they are checked here rather than
      # asserted in prose. Every published cassette is re-verified from its own evidence:
      # digests, closed schemas, recomputed metrics, recomputed verdict, and a byte
      # comparison against the report that was committed alongside it.
      #
      # The treatment cassette exits 2 on purpose. Its null control fell outside the
      # published tolerance band, and the pre-registered rule for that case is to report
      # the experiment as INVALID_EXPERIMENT — not to widen the band. The expected exit
      # code is asserted per cassette so a change that silently turned that into a pass
      # would fail the build.
      - name: Verify the published cassettes
        run: |
          set -u
          failed=0
          for entry in "null-control-as-recorded:0" \
                       "null-control-arms-swapped:0" \
                       "treatment-replace-cache:2"; do
            name="${entry%:*}"
            want="${entry#*:}"
            uv run morrow verify "cassettes/$name" && got=0 || got=$?
            if [ "$got" != "$want" ]; then
              echo "::error::cassettes/$name exited $got, expected $want"
              failed=1
            fi
          done
          exit "$failed"
