apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  # The MCP server ships with Foundry but is disabled by default. MORROW uses it for
  # investigating a trajectory after a verdict has already been decided — never as an
  # input to the decision itself. See docs/architecture/operations.md §11.
  mcp:
    spec:
      enabled: true
