[project]
name = "orders-api"
version = "0.1.0"
description = "orders-api demo — port-boundary snapshot (main)"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "fakeredis>=2.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orders"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
