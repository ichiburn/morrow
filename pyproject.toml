[project]
name = "morrow"
version = "0.1.0"
description = "Future Friction Gate for AI-native CI/CD — measures whether today's pull request makes tomorrow's changes harder"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "pydantic>=2.9",
    "typer>=0.15",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
]

[project.scripts]
morrow = "morrow.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]
# Only `scripts/build_diagram.py` needs this, and only when rebuilding the demo video.
# Kept out of `dev` so a contributor running the tests does not pay for an image library.
video = [
    "pillow>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morrow"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The demo snapshots are the *subject* of the measurement, not MORROW's own code.
# They are standalone projects with their own configuration, and one of them is
# deliberately written the way a real "performance refactor" would be. Linting them
# here would be linting the experiment.
extend-exclude = ["demo/snapshots"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # flake8-bugbear
    "A",                # flake8-builtins
    "C4",               # flake8-comprehensions
    "PTH",              # flake8-use-pathlib  — the design forbids hard-coded separators
    "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode: the docs are prose, not identifiers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["morrow"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires a live SigNoz or a real coding agent; skipped in CI",
]
